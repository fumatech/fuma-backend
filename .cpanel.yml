---
deployment:
  tasks:
    - /bin/echo "=== Deploying fuma-backend ==="

    # Build Spring Boot jar
    - /bin/mvn -q -DskipTests package

    # Ensure deploy folder exists
    - /bin/mkdir -p /home/fuma/public_html/backend_fumamain

    # Copy latest jar to deploy folder as app.jar
    - /bin/cp target/*.jar /home/fuma/public_html/backend_fumamain/app.jar

    # Stop old PM2 process if exists
    - cd /home/fuma/public_html/backend_fumamain && /bin/pm2 delete fuma-backend || true

    # Start new jar with PM2
    - cd /home/fuma/public_html/backend_fumamain && /bin/pm2 start app.jar --name fuma-backend --interpreter none --restart-delay 5000

    # Save PM2 process list (so it survives reboot if startup is set)
    - /bin/pm2 save

    - /bin/echo "=== fuma-backend deploy complete ==="
